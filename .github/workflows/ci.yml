name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # psycopg2 has no wheels and builds against libpq
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install dependencies
        run: pip install -r requirements_dev.txt

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: ty
        run: ty check --python "$(command -v python)"

  # The public API's contract (S6.3): docs/public-api/openapi-v1.json against
  # the base branch's. Removing or renaming a field, changing a type or making
  # a field required fails here: that needs /api/v2 (PUBLIC_API.md §8). That
  # the file is the code's contract is checked by tests/unit/public_api
  public-api-compat:
    name: public-api-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare the public OpenAPI with the base branch's
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SPEC: docs/public-api/openapi-v1.json
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          if ! git show "$BASE:$SPEC" > "$RUNNER_TEMP/base/openapi-v1.json" 2>/dev/null; then
            echo "No public OpenAPI at $BASE yet: nothing to compare"
            exit 0
          fi
          docker run --rm \
            -v "$RUNNER_TEMP/base:/base:ro" \
            -v "$PWD/docs/public-api:/revision:ro" \
            tufin/oasdiff:v1.34.1@sha256:67a23cfea7d251e2ae34ee703ac8733c5d96bc2e7b90fd0f4d475ec99367b85f breaking \
            /base/openapi-v1.json /revision/openapi-v1.json \
            --fail-on ERR --format githubactions

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway credentials for the CI service container only
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install dependencies
        run: pip install -r requirements_dev.txt

      # What core writes to Kafka against contracts/events (see contracts/README.md).
      # `pytest` below runs them again; this step names the failure
      - name: Contract tests
        run: pytest tests/contract

      # Same as `make test`: the PostgreSQL tests are skipped without TEST_DATABASE_URL
      - name: Unit and integration tests
        run: pytest --cov=src --cov-report=

      # Same as `make test-integration`; the database name must end in _test.
      # The fixtures create the roles with these throwaway passwords; the app,
      # the worker and the migrations run as them, under row-level security,
      # and the tenant isolation suite fails the job if any route leaks
      - name: PostgreSQL tests
        if: ${{ !cancelled() }}
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/faclab_test
          TEST_DATABASE_URL_APP: postgresql://faclab_app:faclab_app@localhost:5432/faclab_test
          TEST_DATABASE_URL_WORKER: postgresql://faclab_worker:faclab_worker@localhost:5432/faclab_test
          TEST_DATABASE_URL_MIGRATIONS: postgresql://faclab_owner:faclab_owner@localhost:5432/faclab_test
          TEST_DATABASE_URL_MONITOR: postgresql://faclab_monitor:faclab_monitor@localhost:5432/faclab_test
        run: pytest tests/integration/postgres --cov=src --cov-append --cov-report=

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage report
          coverage xml
          coverage html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  # The public API's examples (S6.5): every guide's curl, Python and
  # JavaScript example (docs/public-api/examples/run-all.sh) against a sandbox
  # core started here: PostgreSQL, the API and the worker, without Kafka. The
  # webhooks reach receivers on this runner, so private URLs are allowed (only
  # possible with ENVIRONMENT=local). A change that breaks a guide fails here
  examples:
    name: examples
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway credentials for the CI service container only
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: local
      # The roles with throwaway passwords, as in the test job
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/faclab_sandbox
      DATABASE_URL_MIGRATIONS: postgresql://faclab_owner:faclab_owner@localhost:5432/faclab_sandbox
      DATABASE_URL: postgresql://faclab_app:faclab_app@localhost:5432/faclab_sandbox
      DATABASE_URL_WORKER: postgresql://faclab_worker:faclab_worker@localhost:5432/faclab_sandbox
      KAFKA_ENABLED: "false"
      OTEL_ENABLED: "false"
      RUN_BACKGROUND: "false"
      INTEGRATION_ENVIRONMENT: sandbox
      WEBHOOK_ALLOW_PRIVATE_URLS: "true"
      WEBHOOK_STOCK_BATCH_SECONDS: "1"
      FACLAB_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev jq bc

      - name: Install dependencies
        run: pip install -r requirements_dev.txt

      - name: Create the database and migrate it
        run: |
          python -m src.shared.infra.db_roles
          alembic upgrade head

      # The secret goes to a file only the runner reads, never to the log
      - name: Create the sandbox company and its integration client
        run: |
          PROVISION_ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24) + "Aa1!")')" \
            python -m scripts.sandbox --ruc 0999999980001 --legal-name "Tienda Demo (sandbox)" \
            --admin-username sandbox-admin --admin-email sandbox-admin@example.com \
            --client-name CI --credentials-file "$RUNNER_TEMP/sandbox.env"

      - name: Start the API and the worker
        run: |
          WORKER_HEALTH_FILE="$RUNNER_TEMP/worker-health.json" nohup python worker.py >"$RUNNER_TEMP/worker.log" 2>&1 &
          nohup uvicorn main:app --host 127.0.0.1 --port 3000 >"$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 60); do
            curl -sf "$FACLAB_API_URL/health/ready" >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Run the examples
        run: |
          set -a
          . "$RUNNER_TEMP/sandbox.env"
          set +a
          echo "::add-mask::$FACLAB_CLIENT_SECRET"
          docs/public-api/examples/run-all.sh

      - name: Logs of the API and the worker
        if: failure()
        run: |
          echo "--- api"; tail -n 200 "$RUNNER_TEMP/api.log" || true
          echo "--- worker"; tail -n 200 "$RUNNER_TEMP/worker.log" || true
