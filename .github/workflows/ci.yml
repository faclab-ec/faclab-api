name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # psycopg2 has no wheels and builds against libpq
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install dependencies
        run: pip install -r requirements_dev.txt

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: ty
        run: ty check --python "$(command -v python)"

  # The public API's contract (S6.3): docs/public-api/openapi-v1.json against
  # the base branch's. Removing or renaming a field, changing a type or making
  # a field required fails here: that needs /api/v2 (PUBLIC_API.md §8). That
  # the file is the code's contract is checked by tests/unit/public_api
  public-api-compat:
    name: public-api-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare the public OpenAPI with the base branch's
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SPEC: docs/public-api/openapi-v1.json
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          if ! git show "$BASE:$SPEC" > "$RUNNER_TEMP/base/openapi-v1.json" 2>/dev/null; then
            echo "No public OpenAPI at $BASE yet: nothing to compare"
            exit 0
          fi
          docker run --rm \
            -v "$RUNNER_TEMP/base:/base:ro" \
            -v "$PWD/docs/public-api:/revision:ro" \
            tufin/oasdiff:v1.34.1 breaking \
            /base/openapi-v1.json /revision/openapi-v1.json \
            --fail-on ERR --format githubactions

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway credentials for the CI service container only
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install dependencies
        run: pip install -r requirements_dev.txt

      # What core writes to Kafka against contracts/events (see contracts/README.md).
      # `pytest` below runs them again; this step names the failure
      - name: Contract tests
        run: pytest tests/contract

      # Same as `make test`: the PostgreSQL tests are skipped without TEST_DATABASE_URL
      - name: Unit and integration tests
        run: pytest --cov=src --cov-report=

      # Same as `make test-integration`; the database name must end in _test.
      # The fixtures create the roles with these throwaway passwords; the app,
      # the worker and the migrations run as them, under row-level security,
      # and the tenant isolation suite fails the job if any route leaks
      - name: PostgreSQL tests
        if: ${{ !cancelled() }}
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/faclab_test
          TEST_DATABASE_URL_APP: postgresql://faclab_app:faclab_app@localhost:5432/faclab_test
          TEST_DATABASE_URL_WORKER: postgresql://faclab_worker:faclab_worker@localhost:5432/faclab_test
          TEST_DATABASE_URL_MIGRATIONS: postgresql://faclab_owner:faclab_owner@localhost:5432/faclab_test
        run: pytest tests/integration/postgres --cov=src --cov-append --cov-report=

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage report
          coverage xml
          coverage html

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
