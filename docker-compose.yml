services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: api
    env_file:
      - .env
    environment:
      # The outbox relay and the Kafka consumer run in `worker`
      RUN_BACKGROUND: "false"
    volumes:
      - ./:/app/
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health/live', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - faclab_network
  # Outbox relay, Kafka consumer and purges (ADR-0007). No hot reload:
  # `docker compose restart worker` after a change
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: worker
    command: ["python", "worker.py"]
    env_file:
      - .env
    volumes:
      - ./:/app/
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "src.shared.infra.worker.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - faclab_network
  db:
    image: postgres:17
    container_name: db
    restart: always
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - .data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - faclab_network

networks:
  faclab_network:
    external: true
